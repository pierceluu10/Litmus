    <polygon points="11,20 16,19 21,20 16,21.6" fill="#6d7e97" stroke="#6d7e97"/>
    <polygon points="5,18 8,19 11,20 9,26" fill="#8293ab" stroke="#8293ab"/>
    <polygon points="27,18 24,19 21,20 23,26" fill="#6a7b94" stroke="#6a7b94"/>
    <polygon points="11,20 16,21.6 13,27 9,26" fill="#93a3b9" stroke="#93a3b9"/>
