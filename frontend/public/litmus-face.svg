    <polygon points="8,14 16,13 14.5,19 8,19" fill="#d5dde8" stroke="#d5dde8"/>
    <polygon points="24,14 16,13 17.5,19 24,19" fill="#bfcadb" stroke="#bfcadb"/>
    <polygon points="8,19 14.5,19 16,20 11,20" fill="#c3cddc" stroke="#c3cddc"/>
    <polygon points="24,19 17.5,19 16,20 21,20" fill="#b1bed1" stroke="#b1bed1"/>
    <!-- nose and eyes -->
    <polygon points="16,13 14.3,19 16,20" fill="#f8fafc" stroke="#f8fafc"/>
    <polygon points="16,13 17.7,19 16,20" fill="#b8c4d5" stroke="#b8c4d5"/>
